<div class="bg-white/95 rounded-xl shadow-md p-3 md:p-6 text-slate-800">
    <div class="flex flex-wrap justify-between items-center mb-3 pb-2 border-b gap-2">
        <h2 class="text-base md:text-lg font-black text-slate-800 uppercase flex items-center gap-2">
            <i class="fa-solid fa-calendar-day text-blue-600"></i> BẢNG THỐNG KÊ TRẬN PICK NGÀY <span id="current-date-title" class="text-blue-700">1/10/26</span>
        </h2>
        <div class="flex items-center gap-2">
            <button onclick="addMatchToCurrentDate()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-1.5 rounded-lg shadow font-bold flex items-center gap-1">
                <i class="fa-solid fa-plus"></i> Thêm Trận
            </button>
        </div>
    </div>

    <div class="mb-3 bg-amber-50 p-2.5 rounded-lg border border-amber-200 flex flex-wrap items-center justify-between gap-2">
        <span class="text-xs font-bold text-amber-900 flex items-center gap-1">
            <i class="fa-solid fa-coins"></i> KÈO ÁP DỤNG TOÀN NGÀY:
        </span>
        <select id="keo-mode-select" onchange="applyKeoToAllMatchesInDate(this.value)" class="text-xs p-1.5 border rounded bg-white font-bold outline-none border-amber-400 text-slate-800 cursor-pointer">
            <option value="default">Kèo (+5k/-15k)</option>
            <option value="k25">Kèo 25k (0k/-25k)</option>
            <option value="k0">Kèo 0K (0k/0k)</option>
            <option value="free">Kèo Tự Do (Tùy chỉnh riêng từng trận)</option>
        </select>
    </div>

    <div class="smooth-scroll rounded-lg border border-slate-200 shadow-inner">
        <table class="w-full min-w-[780px] text-center border-collapse border border-slate-300 text-xs">
            <thead>
                <tr class="bg-slate-100 text-slate-700 font-bold">
                    <th class="p-2 border w-10">STT</th>
                    <th class="p-2 border bg-emerald-100 text-emerald-900" colspan="2">CẶP PICK 1</th>
                    <th class="p-2 border bg-purple-100 text-purple-900 w-20">TỶ SỐ</th>
                    <th class="p-2 border bg-red-100 text-red-900" colspan="2">CẶP PICK 2</th>
                    <th class="p-2 border bg-amber-100 text-amber-900 w-28">CHỌN KÈO TRẬN</th>
                    <th class="p-2 border bg-amber-100 text-amber-900" colspan="2">KÈO BAN ĐẦU</th>
                    <th class="p-2 border w-12 bg-slate-200 text-slate-800"><i class="fa-solid fa-gear"></i></th>
                </tr>
            </thead>
            <tbody id="day-matches-body"></tbody>
        </table>
    </div>
</div>

<div class="bg-white/95 rounded-xl shadow-md p-3 md:p-6 text-slate-800 mt-4">
    <div class="flex flex-wrap justify-between items-center mb-3 pb-2 border-b gap-2">
        <div class="flex flex-wrap items-center gap-3">
            <h2 class="text-base md:text-lg font-black text-slate-800 uppercase flex items-center gap-2">
                <i class="fa-solid fa-calculator text-indigo-600"></i> BẢNG TỔNG HỢP KÈO THU CHI
            </h2>
            <!-- Khung chọn danh sách pick thủ nghỉ (chọn nhiều người) -->
            <div class="flex items-center gap-1.5 bg-rose-50 border border-rose-200 px-2 py-1 rounded-lg">
                <span class="text-xs font-bold text-rose-800 flex items-center gap-1">
                    <i class="fa-solid fa-user-slash"></i> Pick thủ nghỉ:
                </span>
                <select id="absent-players-select" multiple onchange="handleAbsentPlayersChange(this)" class="text-xs p-1 border rounded bg-white font-medium outline-none border-rose-300 text-slate-800 cursor-pointer min-w-[140px]" title="Giữ Ctrl hoặc chạm nhiều lần để chọn nhiều pick thủ">
                    <!-- Danh sách pick thủ sẽ được render động từ JS -->
                </select>
                <span class="text-[10px] text-slate-500 italic">(Chọn nhiều)</span>
            </div>
        </div>

        <div class="flex items-center gap-2 bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-300">
            <span id="admin-status-badge" class="text-xs font-bold text-slate-600 flex items-center gap-1">
                <i class="fa-solid fa-lock text-red-500"></i> Mở Khóa Admin Tích Nộp:
            </span>
            <input type="password" id="admin-pass-input" placeholder="Nhập Pass..." class="w-24 text-xs p-1 border rounded outline-none focus:ring-1 focus:ring-blue-500">
            <button onclick="checkAdminPassword()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-2 py-1 rounded font-bold shadow"> Xác Nhận </button>
        </div>
    </div>

    <div class="smooth-scroll rounded-lg border border-slate-200 shadow-inner">
        <table class="w-full min-w-[780px] text-center border-collapse border border-slate-300 text-xs">
            <thead>
                <tr class="bg-slate-100 text-slate-700 font-bold">
                    <th class="p-2 border w-28 text-left pl-3">PICK THỦ</th>
                    <th class="p-2 border w-16">SỐ TRẬN</th>
                    <th class="p-2 border w-20">THẮNG/K</th>
                    <th class="p-2 border w-20">THUA/K</th>
                    <th class="p-2 border w-24">MANG VỀ</th>
                    <th class="p-2 border w-20">TỔNG</th>
                    <th class="p-2 border w-36 bg-rose-50 text-rose-900">XIN NGHỈ</th>
                    <th class="p-2 border w-20 bg-amber-100 text-amber-900">THỰC TẾ (ADMIN)</th>
                    <th class="p-2 border w-28">NOTE</th>
                </tr>
            </thead>
            <tbody id="day-summary-body" class="font-semibold"></tbody>
        </table>
    </div>
</div>
