<!-- TAB TRANG CHỦ (HOME) -->
<div id="tab-home" class="tab-content space-y-4">
    
    <!-- 1. KHUNG MỞ KHÓA ADMIN (ĐẶT Ở TRÊN CÙNG, NGOÀI CONTAINER ĐỘNG) -->
    <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-2">
            <span id="home-admin-status-badge" class="text-xs font-bold text-slate-600 flex items-center gap-1">
                <i class="fa-solid fa-lock text-red-500"></i> Chưa Mở Khóa Admin
            </span>
        </div>
        <div class="flex items-center gap-2">
            <input type="password" id="admin-pass-input" placeholder="Mật khẩu Admin..." class="text-xs border rounded px-2.5 py-1.5 outline-none w-36 focus:ring-1 focus:ring-emerald-500">
            <button onclick="checkAdminPassword()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-1.5 rounded font-bold shadow transition-colors flex items-center gap-1">
                <i class="fa-solid fa-key"></i> Xác thực
            </button>
        </div>
    </div>

    <!-- 2. KHUNG TIÊU ĐỀ NGÀY GẦN NHẤT -->
    <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
        <div class="flex justify-between items-center mb-3">
            <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2">
                <i class="fa-solid fa-calendar-day text-emerald-600"></i> Ngày thi đấu gần nhất: 
                <span id="home-closest-date-title" class="text-emerald-700 font-extrabold">---</span>
            </h3>
            <button onclick="goToClosestDateTab()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-3 py-1 rounded transition-colors">
                Xem chi tiết <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>

        <!-- CONTAINER ĐỂ JAVASCRIPT ĐỔ DỮ LIỆU BẢNG ĐẤU VÀO (KHÔNG ĐƯỢC ĐẶT CODE GIAO DIỆN KHÁC Ở ĐÂY) -->
        <div id="home-closest-date-container"></div>
    </div>

</div>
