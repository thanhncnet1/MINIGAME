<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLB-PICKLEBALL-CMTD - Quản Lý Giải Đấu & Quỹ</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                            900: '#14532d',
                        },
                        court: {
                            500: '#0284c7',
                            600: '#0369a1',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts Inter & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- SheetJS (XLSX) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    
    <style>
        .excel-table th {
            background-color: #1e3a8a;
            color: white;
            text-align: center;
            font-size: 0.8rem;
            padding: 6px 4px;
            white-space: nowrap;
        }
        .excel-table td {
            padding: 4px 4px;
            font-size: 0.8rem;
            border: 1px solid #e5e7eb;
        }
        .excel-table input, .excel-table select {
            width: 100%;
            padding: 2px 4px;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            font-size: 0.8rem;
        }

        .player-cell {
            min-width: 120px;
            font-weight: 600;
        }

        .player-tag, .player-select-btn {
            font-weight: 800 !important;
            color: #1e40af !important;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
            border-radius: 6px;
            padding: 2px 6px;
            display: inline-block;
        }
        .player-tag:hover, .player-select-btn:hover {
            background-color: #fef08a !important;
            color: #0369a1 !important;
            transform: scale(1.03);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
        }

        .bg-theme-slate { background-color: #f1f5f9; }
        .bg-theme-dark { background-color: #0f172a; color: #f8fafc; }
        .bg-theme-emerald { background-color: #ecfdf5; }
        .bg-theme-blue { background-color: #eff6ff; }

        .dropdown-menu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            min-width: 260px;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            border: 1px solid #cbd5e1;
            z-index: 9999 !important;
            padding: 4px 0;
            color: #1e293b;
        }
        .dropdown-menu.show { display: block; }
        .dropdown-item {
            padding: 8px 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            color: #334155;
        }
        .dropdown-item:hover { background-color: #f1f5f9; color: #2563eb; }
        .dropdown-divider { height: 1px; background-color: #e2e8f0; margin: 3px 0; }
        
        .txt-win { color: #16a34a; font-weight: 800; }
        .txt-lose { color: #dc2626; font-weight: 800; }
        .note-paid { color: #16a34a; font-weight: 800; }
        .note-unpaid { color: #ef4444; font-weight: 800; }

        .score-input {
            width: 36px !important;
            height: 26px;
            padding: 0 !important;
            font-weight: 800;
            text-align: center;
            font-size: 12px;
            border: 1.5px solid #a855f7 !important;
            border-radius: 4px;
            background: #ffffff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }
        .score-input:focus {
            outline: none;
            border-color: #2563eb !important;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
        }

        .keo-custom-input {
            width: 40px !important;
            height: 22px;
            padding: 0 2px !important;
            font-size: 11px;
            font-weight: 800;
            text-align: center;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
        }
        .ham-text {
            background-color: #ef4444;
            color: white;
            font-weight: 900;
            font-size: 9px;
            padding: 2px 0;
            border-radius: 3px;
            display: block;
            width: 100%;
            text-align: center;
            line-height: 1;
            cursor: pointer;
        }

        .smooth-scroll, .custom-scrollbar {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .wrap-content-cell {
            white-space: normal !important;
            word-break: break-word !important;
            line-height: 1.4;
        }
    </style>
</head>
<body id="app-body" class="bg-theme-slate min-h-screen flex flex-col font-sans transition-colors duration-300 text-slate-800" onclick="closeAllDropdowns()">

    <!-- KHỐI BANNER & NAVBAR -->
    <div id="component-header"></div>

    <!-- MAIN CONTAINER CHỨA NỘI DUNG CÁC TAB -->
    <main class="max-w-7xl mx-auto w-full p-2 md:p-4 flex-grow space-y-6">
        <section id="tab-home" class="tab-content"></section>
        <section id="tab-create_tournament" class="tab-content hidden"></section>
        <section id="tab-players" class="tab-content hidden"></section>
        <section id="tab-minigame1" class="tab-content hidden space-y-6"></section>
        <section id="tab-minigame2" class="tab-content hidden"></section>
        <section id="tab-day_detail" class="tab-content hidden space-y-6"></section>
        <section id="tab-fund_manager" class="tab-content hidden space-y-6"></section>
        <section id="tab-tonghop" class="tab-content hidden"></section>
    </main>

    <!-- KHỐI MODALS -->
    <div id="component-modals"></div>

    <!-- SCRIPT TỰ ĐỘNG NẠP CÁC KHỐI -->
    <script>
        async function loadComponent(elementId, filePath) {
            try {
                const response = await fetch(filePath);
                if (!response.ok) throw new Error(`Không thể nạp file ${filePath}`);
                const html = await response.text();
                document.getElementById(elementId).innerHTML = html;
            } catch (error) {
                console.error("Lỗi nạp component:", error);
            }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            await Promise.all([
                loadComponent('component-header', 'components/header.html'),
                loadComponent('tab-home', 'components/tab-home.html'),
                loadComponent('tab-create_tournament', 'components/tab-create_tournament.html'),
                loadComponent('tab-players', 'components/tab-players.html'),
                loadComponent('tab-minigame1', 'components/tab-minigame1.html'),
                loadComponent('tab-minigame2', 'components/tab-minigame2.html'),
                loadComponent('tab-day_detail', 'components/tab-day_detail.html'),
                loadComponent('tab-fund_manager', 'components/tab-fund_manager.html'),
                loadComponent('tab-tonghop', 'components/tab-tonghop.html'),
                loadComponent('component-modals', 'components/modals.html')
            ]);

            if (typeof window.onloadApp === 'function') {
                window.onloadApp();
            }
        });
    </script>

    <!-- TOÀN BỘ SCRIPT JAVASCRIPT & FIREBASE REALTIME -->
    <script src="js/main.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDYCKzobz_fr-1BcHt3TxmOuX1nHCOQFMs",
            authDomain: "minigame-bb991.firebaseapp.com",
            projectId: "minigame-bb991",
            storageBucket: "minigame-bb991.appspot.com"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const getVal = (id) => document.getElementById(id)?.value || "";
        const setVal = (id, val) => {
            const el = document.getElementById(id);
            if (el && val !== undefined) el.value = val;
        };

        window.syncToFirebase = window.saveStateToFirebase = window.saveDataToFirebase = async function() {
            try {
                const knockoutScores = {
                    bk1: [getVal('bk1-s1'), getVal('bk1-s2')],
                    bk2: [getVal('bk2-s1'), getVal('bk2-s2')],
                    t3:  [getVal('t3-s1'),  getVal('t3-s2')],
                    ck:  [getVal('ck-s1'),  getVal('ck-s2')]
                };

                await setDoc(doc(db, "minigame", "app_state"), {
                    players: window.players,
                    createdMinigames: window.createdMinigames,
                    currentBracketMinigameId: window.currentBracketMinigameId,
                    minigameTeamData: window.minigameTeamData,
                    m2PairsA: window.m2PairsA,
                    m2PairsB: window.m2PairsB,
                    m2ScoresA: window.m2ScoresA,
                    m2ScoresB: window.m2ScoresB,
                    m2KeoState: window.m2KeoState,
                    dates: window.dates,
                    matchesData: window.matchesData,
                    dateKeoMode: window.dateKeoMode,
                    paymentStatus: window.paymentStatus,
                    activeQuarterColumns: window.activeQuarterColumns,
                    initialFund: window.initialFund,
                    fundFeeStatus: window.fundFeeStatus,
                    fundIncomes: window.fundIncomes,
                    fundExpenses: window.fundExpenses,
                    autoIncomeNotes: window.autoIncomeNotes,
                    knockoutScores: knockoutScores
                }, { merge: true });
                console.log("Đã đồng bộ Firestore!");
            } catch (error) {
                console.error("Lỗi đồng bộ Firestore:", error);
            }
        };

        onSnapshot(doc(db, "minigame", "app_state"), 
            (docSnap) => {
                const updateStatus = (text, cls, dotCls) => {
                    ['status-element', 'status-element-mobile'].forEach(id => {
                        const el = document.getElementById(id);
                        if (el) { el.innerText = text; el.className = cls; }
                    });
                    ['status-dot', 'status-dot-mobile'].forEach(id => {
                        const el = document.getElementById(id);
                        if (el) el.className = dotCls;
                    });
                };

                updateStatus("Firestore Online", "text-xs text-emerald-400 font-bold", "w-2 h-2 rounded-full bg-emerald-500 animate-ping");

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (data.players) window.players = data.players;
                    if (data.createdMinigames) window.createdMinigames = data.createdMinigames;
                    if (data.currentBracketMinigameId) window.currentBracketMinigameId = data.currentBracketMinigameId;
                    if (data.minigameTeamData) {
                        window.minigameTeamData = data.minigameTeamData;
                        if(typeof saveTeamData === 'function') saveTeamData();
                    }
                    if (data.m2PairsA) window.m2PairsA = data.m2PairsA;
                    if (data.m2PairsB) window.m2PairsB = data.m2PairsB;
                    if (data.m2ScoresA) window.m2ScoresA = data.m2ScoresA;
                    if (data.m2ScoresB) window.m2ScoresB = data.m2ScoresB;
                    if (data.m2KeoState) window.m2KeoState = data.m2KeoState;
                    if (data.dates) window.dates = data.dates;
                    if (data.matchesData) window.matchesData = data.matchesData;
                    if (data.dateKeoMode) window.dateKeoMode = data.dateKeoMode;
                    if (data.paymentStatus) window.paymentStatus = data.paymentStatus;
                    if (data.activeQuarterColumns) window.activeQuarterColumns = data.activeQuarterColumns;
                    if (data.initialFund !== undefined) window.initialFund = data.initialFund;
                    if (data.fundFeeStatus) window.fundFeeStatus = data.fundFeeStatus;
                    if (data.fundIncomes) window.fundIncomes = data.fundIncomes;
                    if (data.fundExpenses) window.fundExpenses = data.fundExpenses;
                    if (data.autoIncomeNotes) window.autoIncomeNotes = data.autoIncomeNotes;

                    if (data.knockoutScores) {
                        const s = data.knockoutScores;
                        if (s.bk1) { setVal('bk1-s1', s.bk1[0]); setVal('bk1-s2', s.bk1[1]); }
                        if (s.bk2) { setVal('bk2-s1', s.bk2[0]); setVal('bk2-s2', s.bk2[1]); }
                        if (s.t3)  { setVal('t3-s1',  s.t3[0]);  setVal('t3-s2',  s.t3[1]); }
                        if (s.ck)  { setVal('ck-s1',  s.ck[0]);  setVal('ck-s2',  s.ck[1]); }
                    }

                    if (typeof window.refreshAllViews === 'function') window.refreshAllViews();
                    if (typeof window.autoBackupData === 'function') window.autoBackupData();
                }
            },
            (error) => {
                console.error("Lỗi Firestore:", error);
                const el = document.getElementById('status-element');
                if (el) { el.innerText = "Offline"; el.className = "text-xs text-red-400 font-bold"; }
            }
        );
    </script>
</body>
</html>
