name: Deploy static content to Pages

on:
  # Tự động chạy khi có commit/push vào branch main
  push:
    branches: ["main"]

  # Cho phép chạy thủ công từ tab Actions nếu cần
  workflow_dispatch:

# Cấp quyền đọc code và ghi đè tài nguyên Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Giới hạn chạy 1 deploy tại một thời điểm
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact (File tĩnh HTML/CSS/JS)
        uses: actions/upload-pages-artifact@v3
        with:
          # Tải lên toàn bộ file ở thư mục gốc repo
          path: '.'

      - name: Deploy lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
